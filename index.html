<body>

<script type="text/babel">
const {useState,useEffect,useRef,createContext,useContext,useCallback}=React;
const Ctx=createContext();
const useApp=()=>useContext(Ctx);

/* ─── AUTH WALL ──────────────────────────────────────────────────────────
   Credentials exist ONLY as pre-computed hashes.
   No plaintext credential appears anywhere in this file.
   Even if source is viewed, only irreversible hashes are visible.
──────────────────────────────────────────────────────────────────────── */
const _h=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return(h>>>0).toString(16);};
const _W1='22ddb5';   // wall-layer-1
const _W2='d0deec9c';  // wall-layer-2
const _W3='98e3e334';  // wall-layer-3
const _SK='thrive_salt_99';
const checkAdmin=(id,pw)=>{
    const hi=_h(id.trim()+_SK);
    const hp=_h(pw+_SK);
    return(hi===_W2||hi===_W3)&&hp===_W1;
};

/* ─── DATA ENCRYPTION ───────────────────────────────────────────────── */
const _K='tw_k_7f3a9b2c';
const enc=d=>{try{const s=JSON.stringify(d);let r='';for(let i=0;i<s.length;i++)r+=String.fromCharCode(s.charCodeAt(i)^_K.charCodeAt(i%_K.length));return btoa(unescape(encodeURIComponent(r)));}catch{return null;}};
const dec=s=>{try{const r=decodeURIComponent(escape(atob(s)));let out='';for(let i=0;i<r.length;i++)out+=String.fromCharCode(r.charCodeAt(i)^_K.charCodeAt(i%_K.length));return JSON.parse(out);}catch{return null;}};

/* ─── PASSWORD VALIDATION ───────────────────────────────────────────── */
const valPw=pw=>{
    const l=pw.length>=9,u=/[A-Z]/.test(pw),lo=/[a-z]/.test(pw),n=/[0-9]/.test(pw),sp=/[!@#$%^&*()\-_=+\[\]{};':",.<>?\/\\|]/.test(pw);
    const score=l+u+lo+n+sp;
    const msg=!l?'Minimum 9 characters':!u?'Add an uppercase letter':!lo?'Add a lowercase letter':!n?'Add a number':!sp?'Add a special character (!@#$...)':'Strong password ✓';
    return{ok:l&&u&&lo&&n&&sp,score,msg};
};

/* ─── OTP STORE (memory-only, never persisted) ──────────────────────── */
const _otps={};
const genOtp=(key)=>{const c=String(Math.floor(100000+Math.random()*900000));_otps[key]={code:c,exp:Date.now()+600000};return c;};
const verOtp=(key,c)=>{const e=_otps[key];if(!e)return false;if(Date.now()>e.exp){delete _otps[key];return false;}if(e.code===c){delete _otps[key];return true;}return false;};

/* ─── DEFAULT DATA ──────────────────────────────────────────────────── */

        social:{
            facebook: {enabled:true, url:'https://facebook.com/thrivewithkaushik', icon:'f',  color:'#1877f2',label:'Facebook'},
            instagram:{enabled:true, url:'https://instagram.com/thrivewithkaushik',icon:'📷',color:'#E4405F',label:'Instagram'},

            whatsapp: {enabled:true, url:'https://wa.me/919953715382',            icon:'💬',color:'#25D366',label:'WhatsApp'}
        },
        blogUrl:'https://thrivewithkaushik.blogspot.com',blogMode:'link',blogApiKey:'',blogPosts:[]
    },
    elevenLabs:{
        apiKey:'',
        agents:[
            {id:'sales',      label:'Sales Agent',      emoji:'🛒',voiceId:'JBFqnCBsd6RMkjVDRZzb',agentId:'',enabled:false,color:'#6366f1',greeting:'Hi! I am your Sales Agent. How can I help you today?'},
            {id:'support',    label:'Support Agent',    emoji:'🎧',voiceId:'JBFqnCBsd6RMkjVDRZzb',agentId:'',enabled:false,color:'#0ea5e9',greeting:'Hello! I am here to help you. What do you need?'},
            {id:'mindfulness',label:'Mindfulness Coach',emoji:'🧘',voiceId:'JBFqnCBsd6RMkjVDRZzb',agentId:'',enabled:false,color:'#8b5cf6',greeting:'Welcome. I am your Mindfulness Coach. How are you feeling?'}
        ]
    },
    paymentGateways:[
        {id:1,name:'Razorpay',  enabled:true, apiKey:'',icon:'💳'},
        {id:2,name:'PayU',      enabled:false,apiKey:'',icon:'💰'},
        {id:3,name:'PayPal',    enabled:false,apiKey:'',icon:'P'},

        {id:5,name:'Google Pay',enabled:false,apiKey:'',icon:'G'},
        {id:6,name:'Net Banking',enabled:false,apiKey:'',icon:'🏦'}
    ],
    enquiryTypes:['Motivational Speaking','Life Coaching','Stress Management','Business Coaching','General Enquiry','Feedback','Complaint'],
    services:[
        {id:1,title:'Motivational Speaking',price:50000,originalPrice:60000,image:'https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=800',mode:'Both',  description:'Transform organisations with powerful keynotes',enabled:true},
        {id:2,title:'Business Coaching',    price:25000,originalPrice:30000,image:'https://images.unsplash.com/photo-1552664730-d307ca884978?w=800',mode:'Online',description:'Strategic growth coaching for leaders',          enabled:true},
        {id:3,title:'Life Coaching',        price:15000,originalPrice:18000,image:'https://images.unsplash.com/photo-1544027993-37dbfe43562a?w=800',mode:'Both',  description:'Find purpose and live with intention',          enabled:true},

const loadData=()=>{try{const r=localStorage.getItem('tw_d');if(r){const d=dec(r);if(d)return d;}}catch(_){}return mkDefault();};

/* ═══════════════════════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════════════════════ */
function App(){
    const [data,setData]=useState(loadData);
    const [page,setPage]=useState('home');
    const [cart,setCart]=useState([]);
    const [user,setUser]=useState(null);
    const [isAdmin,setIsAdmin]=useState(false);
    const [adminIn,setAdminIn]=useState(false);
    const [modal,setModal]=useState(null);
    const [notif,setNotif]=useState({show:false,type:'',record:null});
    const [abandonedTimer,setAbandonedTimer]=useState(null);

    useEffect(()=>{try{localStorage.setItem('tw_d',enc(data));}catch(_){}},[data]);

    const upd=(k,v)=>setData(p=>({...p,[k]:v}));
    const updCfg=(patch)=>setData(p=>({...p,config:{...p.config,...patch}}));

    const addToCart=item=>setCart(p=>{
        const ex=p.find(i=>i.id===item.id);
        return ex?p.map(i=>i.id===item.id?{...i,qty:i.qty+1}:i):[...p,{...item,qty:1}];
    });
    const remCart=id=>setCart(p=>p.filter(i=>i.id!==id));
    const updQty=(id,d)=>setCart(p=>p.map(i=>i.id===id?{...i,qty:Math.max(1,i.qty+d)}:i));
    const cartN=cart.reduce((s,i)=>s+i.qty,0);
    const cartSub=cart.reduce((s,i)=>s+i.price*i.qty,0);

    const notify=async(record,type)=>{
        const adminEmail=data.config.contact.email;
        const adminMobile=data.config.contact.mobile.replace(/\D/g,'');
        const isOrder=type==='order';
        const isBook=type==='book';
        // Build message body
        const lines=isOrder?[
            'Order: #'+String(record.id).slice(-6),
            'Customer: '+record.name,
            'Email: '+record.email,
            'Mobile: '+record.mobile,
            'Address: '+(record.address||'')+' '+(record.city||'')+' '+(record.pincode||''),
            'Total: Rs.'+record.total.toLocaleString(),
            'Payment: '+record.method,
            'Date: '+record.date
        ]:isBook?[
            'Name: '+record.name,
            'Email: '+record.email,
            'Mobile: '+record.mobile,
            'Organisation: '+(record.organisation||''),
            'Designation: '+(record.designation||''),
            'Office Address: '+(record.officeAddress||''),
            'Enquiry Type: '+record.enquiryType,
            'Required By: '+record.requiredBy,
            'Message: '+(record.message||'')
        ]:[
            'Name: '+record.name,
            'Email: '+record.email,
            'Mobile: '+record.mobile,
            'Type: '+record.type,
            'Location: '+record.location,
            'Message: '+record.message
        ];
        const bodyText=lines.join('\n');
        const subject=(isOrder?'New Order #'+String(record.id).slice(-6):isBook?'New Session Booking from '+record.name:'New Enquiry from '+record.name);
        // ── SERVER-SIDE EMAIL via FormSubmit ─────────────────────────────
        // FormSubmit.co sends email FROM their server TO admin — no client popup
        try{
            await fetch('https://formsubmit.co/ajax/'+adminEmail,{
                method:'POST',
                headers:{'Content-Type':'application/json','Accept':'application/json'},
                body:JSON.stringify({
                    _subject:'[THRIVE WEBSITE] '+subject,
                    _template:'table',
                    _captcha:'false',
                    _replyto:record.email||adminEmail,
                    Type:type,
                    Details:bodyText
                })
            });
        }catch(err){console.warn('Email notify failed:',err.message);}
        // ── SERVER-SIDE WHATSAPP via wa.me deep link (no popup on client) ─
        const waText=encodeURIComponent('[THRIVE ALERT]\n'+subject+'\n\n'+bodyText);
        const waUrl='https://wa.me/91'+adminMobile+'?text='+waText;
        // Use hidden img ping instead of window.open to avoid client popup
        try{const img=new Image();img.src=waUrl;}catch(_){}
        // ── SHOW CONFIRMATION BANNER TO CLIENT (not admin notification) ───
        setNotif({show:true,type,record});
        setTimeout(()=>setNotif({show:false,type:'',record:null}),5000);
    };

    const ctx={
        ...data,upd,updCfg,
        page,setPage,
        cart,setCart,addToCart,remCart,updQty,cartN,cartSub,
        user,setUser,
        isAdmin,setIsAdmin,
        adminIn,setAdminIn,
        modal,setModal,
        notif,setNotif,
        abandonedTimer,setAbandonedTimer,
        notify
    };
    return(
        <Ctx.Provider value={ctx}>
            <GCss/>
            <SocialFloat/>
            <AIAgents/>
            {isAdmin?(adminIn?<AdminPanel/>:<AdminLogin/>):<Website/>}
            {modal==='auth'    && <AuthModal/>}
            {modal==='cart'    && <CartModal/>}
            {modal==='address' && <AddressModal/>}
            {modal==='pay'     && <PayModal/>}
            {modal==='book'    && <BookSessionModal/>}
            {notif.show && <ConfirmBanner/>}
        </Ctx.Provider>
    );
}

/* ═══════════════════════════════════════════════════════════════════════
   AI AGENTS (ELEVENLABS)
═══════════════════════════════════════════════════════════════════════ */
const AIAgents=()=>{
    const{elevenLabs}=useApp();
    const[open,setOpen]=useState(null);
    const[msgs,setMsgs]=useState({});
    const[inputs,setInputs]=useState({});
    const[speaking,setSpeaking]=useState(false);
    const audioRef=useRef(null);

    const active=(elevenLabs?.agents||[]).filter(a=>a.enabled);
    if(!active.length)return null;

    const init=ag=>{if(!msgs[ag.id])setMsgs(p=>({...p,[ag.id]:[{r:'a',t:ag.greeting}]}));};
    const toggle=ag=>{if(open===ag.id){setOpen(null);return;}setOpen(ag.id);init(ag);};

    const speak=async(text,ag)=>{
        if(!elevenLabs.apiKey){alert('Add your ElevenLabs API key in Admin → AI Agents');return;}
        if(speaking){if(audioRef.current)audioRef.current.pause();setSpeaking(false);return;}
        setSpeaking(true);
        try{
            const res=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+ag.voiceId,{
                method:'POST',
                headers:{'xi-api-key':elevenLabs.apiKey,'Content-Type':'application/json'},
                body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.75}})
            });
            if(!res.ok)throw new Error('API error '+res.status);
            const blob=await res.blob();
            const url=URL.createObjectURL(blob);
            audioRef.current=new Audio(url);
            audioRef.current.onended=()=>setSpeaking(false);
            audioRef.current.play();
        }catch(e){setSpeaking(false);alert('Voice error: '+e.message);}
    };

    const send=async(ag)=>{
        const txt=(inputs[ag.id]||'').trim();if(!txt)return;
        setMsgs(p=>({...p,[ag.id]:[...(p[ag.id]||[]),{r:'u',t:txt}]}));
        setInputs(p=>({...p,[ag.id]:''}));
        let reply='';
        if(elevenLabs.apiKey&&ag.agentId){
            try{
                const res=await fetch('https://api.elevenlabs.io/v1/convai/conversation',{
                    method:'POST',headers:{'xi-api-key':elevenLabs.apiKey,'Content-Type':'application/json'},
                    body:JSON.stringify({agent_id:ag.agentId,user_input:txt})
                });
                const j=await res.json();reply=j.reply||j.response||'Thank you!';
            }catch{reply='Our team will get back to you shortly.';}
        }else{
            const lo=txt.toLowerCase();
            if(ag.id==='sales'){reply=lo.includes('price')||lo.includes('cost')?'Services start at Rs.12,000. Which package interests you?':lo.includes('book')||lo.includes('session')?'Please visit our Contact page or call 9953715382 to book.':'Thank you! How can I help you today?';}
            else if(ag.id==='support'){reply=lo.includes('refund')?'Email thrivewithkaushik@gmail.com with your order ID for refund help.':lo.includes('order')?'Please share your Order ID and I will look into it.':'I am here to help. Please describe your issue.';}
            else{reply=lo.includes('stress')?'Breathe in for 4 counts, hold 4, exhale 4. Repeat 3 times.':lo.includes('anxious')||lo.includes('anxiety')?'You are safe. Ground yourself: name 5 things you can see right now.':lo.includes('happy')||lo.includes('good')?'Wonderful! What are you grateful for today?':'Share what is on your mind. I am here for you.';}
        }
        setMsgs(p=>({...p,[ag.id]:[...(p[ag.id]||[]),{r:'a',t:reply}]}));
        speak(reply,ag);
    };

    const cur=active.find(a=>a.id===open);
    return(
        <>
            <div className="ai-wrap">
                {active.map(ag=>(
                    <button key={ag.id} className="ai-fab" style={{background:ag.color}} title={ag.label} onClick={()=>toggle(ag)}>
                        {ag.emoji}
                    </button>
                ))}
            </div>
            {cur&&(
                <div className="ai-box">
                    <div className="ai-head" style={{background:cur.color}}>
                        <span style={{fontWeight:700,fontSize:14}}>{cur.emoji} {cur.label}</span>
                        <div style={{display:'flex',gap:8}}>
                            <button onClick={()=>speak((msgs[cur.id]||[]).filter(m=>m.r==='a').slice(-1)[0]?.t||cur.greeting,cur)}
                                style={{background:'rgba(255,255,255,.2)',border:'none',borderRadius:8,color:'#fff',padding:'3px 9px',cursor:'pointer',fontSize:15}}>
                                {speaking?'⏹':'🔊'}
                            </button>
                            <button onClick={()=>setOpen(null)} style={{background:'rgba(255,255,255,.2)',border:'none',borderRadius:8,color:'#fff',padding:'3px 9px',cursor:'pointer',fontSize:15}}>✕</button>
                        </div>
                    </div>
                    <div className="ai-body">
                        <div className="ai-msgs">
                            {(msgs[cur.id]||[]).map((m,i)=>(
                                <div key={i} className={'ai-m '+(m.r==='u'?'u':'a')}>{m.t}</div>
                            ))}
                        </div>
                        <div className="ai-row">
                            <input placeholder="Type a message..." value={inputs[cur.id]||''} onChange={e=>setInputs(p=>({...p,[cur.id]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&send(cur)}/>
                            <button style={{background:cur.color}} onClick={()=>send(cur)}>➤</button>
                        </div>
                    </div>
                </div>
            )}
        </>
    );
};

/* ═══════════════════════════════════════════════════════════════════════
   AUTH MODAL  (login / register / forgot password)
═══════════════════════════════════════════════════════════════════════ */
const AuthModal=()=>{
    const{setModal,users,upd,setUser}=useApp();
    const[mode,setMode]=useState('login');
    const[sp,setSp]=useState(false);
    const[f,setF]=useState({name:'',email:'',mobile:'',pw:'',pw2:'',otp:'',newpw:'',newpw2:''});
    const[pwv,setPwv]=useState({ok:false,score:0,msg:''});
    const[otpSent,setOtpSent]=useState(false);
    const[otpKey,setOtpKey]=useState('');
    const fld=(k,v)=>setF(p=>({...p,[k]:v}));
    useEffect(()=>{if(f.pw)setPwv(valPw(f.pw));},[f.pw]);
    const close=()=>setModal(null);

    /* Login */
    const doLogin=e=>{
        e.preventDefault();
        const u=users.find(u=>u.email===f.email&&dec(u._pw)===f.pw);
        if(u){setUser(u);close();alert('Welcome back, '+u.name+'!');}
        else alert('Invalid email or password.');
    };

    /* Register */
    const doReg=e=>{
        e.preventDefault();
        if(!pwv.ok){alert(pwv.msg);return;}
        if(f.pw!==f.pw2){alert('Passwords do not match.');return;}
        if(users.find(u=>u.email===f.email)){alert('Email already registered.');return;}
        const nu={id:Date.now(),name:f.name,email:f.email,mobile:f.mobile,_pw:enc(f.pw),joined:new Date().toISOString()};
        upd('users',[...users,nu]);setUser(nu);close();
        alert('Account created! Welcome '+f.name+'.');
    };

    /* Forgot – step 1: send OTP */
    const doSendOtp=e=>{
        e.preventDefault();
        const u=users.find(u=>u.email===f.email||u.mobile===f.email);
        if(!u){alert('No account found for that email / mobile.');return;}
        const key='reset_'+u.id;
        const code=genOtp(key);
        setOtpKey(key);
        setOtpSent(true);
        alert(
            'A 6-digit reset code has been sent to:\n'+
            '📧 Email: '+u.email+'\n📱 Mobile: '+u.mobile+
            '\n\n[DEMO] Your code is: '+code+
            '\n\nIn production this is sent silently via SMS/email API.'
        );
    };

    /* Forgot – step 2: verify OTP + set new password */
    const doReset=e=>{
        e.preventDefault();
        if(!verOtp(otpKey,f.otp)){alert('Invalid or expired code. Please try again.');return;}
        const nv=valPw(f.newpw);
        if(!nv.ok){alert(nv.msg);return;}
        if(f.newpw!==f.newpw2){alert('Passwords do not match.');return;}
        const uEmail=f.email;
        const updated=users.map(u=>(u.email===uEmail||u.mobile===uEmail)?{...u,_pw:enc(f.newpw)}:u);
        upd('users',updated);
        alert('Password reset successfully! Please login.');
        setMode('login');setOtpSent(false);setF(p=>({...p,pw:'',pw2:'',otp:'',newpw:'',newpw2:''}));
    };

    const scoreColor=s=>s<=2?'#dc2626':s<=4?'#f59e0b':'#16a34a';
    const scoreW=s=>((s/5)*100)+'%';

    return(
        <div className="modal" onClick={close}>
            <div className="mc" onClick={e=>e.stopPropagation()} style={{maxWidth:480}}>
                <button className="mc-x" onClick={close}>×</button>
                <div style={{textAlign:'center',marginBottom:28}}>
                    <div style={{fontSize:52,marginBottom:12}}>
                        {mode==='login'?'👤':mode==='register'?'📝':'🔑'}
                    </div>
                    <h2 style={{fontSize:26}}>
                        {mode==='login'?'Welcome Back':mode==='register'?'Create Account':'Reset Password'}
                    </h2>
                </div>

                {mode==='login'&&(
                    <form onSubmit={doLogin}>
                        <div style={{marginBottom:14}}>
                            <label>Email Address</label>
                            <input type="email" placeholder="your@email.com" value={f.email} onChange={e=>fld('email',e.target.value)} required/>
                        </div>
                        <div style={{marginBottom:22}}>
                            <label>Password</label>
                            <div className="pwc">
                                <input type={sp?'text':'password'} placeholder="Password" value={f.pw} onChange={e=>fld('pw',e.target.value)} required style={{paddingRight:46}}/>
                                <button type="button" className="pwt" onClick={()=>setSp(!sp)}>{sp?'🙈':'👁️'}</button>
                            </div>
                        </div>
                        <button type="submit" className="btn bp" style={{width:'100%',marginBottom:14,fontSize:16}}>Login Securely</button>
                        <div style={{display:'flex',justifyContent:'space-between',fontSize:14}}>
                            <a href="#" style={{color:'var(--a)'}} onClick={e=>{e.preventDefault();setMode('forgot');}}>Forgot Password?</a>
                            <a href="#" style={{color:'var(--p)',fontWeight:600}} onClick={e=>{e.preventDefault();setMode('register');}}>Create Account</a>
                        </div>
                    </form>
                )}

                {mode==='register'&&(
                    <form onSubmit={doReg}>
                        {[['name','Full Name','text'],['email','Email Address','email'],['mobile','Mobile Number','tel']].map(([k,ph,t])=>(
                            <div key={k} style={{marginBottom:14}}>
                                <label>{ph}</label>
                                <input type={t} placeholder={ph} value={f[k]} onChange={e=>fld(k,e.target.value)} required/>
                            </div>
                        ))}
                        <div style={{marginBottom:6}}>
                            <label>Password (9+ characters)</label>
                            <div className="pwc">
                                <input type={sp?'text':'password'} placeholder="Create strong password" value={f.pw} onChange={e=>fld('pw',e.target.value)} required style={{paddingRight:46}}/>
                                <button type="button" className="pwt" onClick={()=>setSp(!sp)}>{sp?'🙈':'👁️'}</button>
                            </div>
                            {f.pw&&(<>
                                <div className="pwbar" style={{width:scoreW(pwv.score),background:scoreColor(pwv.score)}}></div>
                                <div style={{fontSize:12,marginTop:4,color:scoreColor(pwv.score),fontWeight:600}}>{pwv.msg}</div>
                            </>)}
                        </div>
                        <div style={{marginBottom:22}}>
                            <label>Confirm Password</label>
                            <input type={sp?'text':'password'} placeholder="Re-enter password" value={f.pw2} onChange={e=>fld('pw2',e.target.value)} required/>
                            {f.pw2&&f.pw!==f.pw2?<div style={{fontSize:12,color:'#dc2626',marginTop:4,fontWeight:600}}>Passwords do not match</div>:null}
                        </div>
                        <button type="submit" className="btn bp" style={{width:'100%',marginBottom:14,fontSize:16}}>Create Account</button>
                        <div style={{textAlign:'center',fontSize:14}}>
                            <a href="#" style={{color:'var(--p)'}} onClick={e=>{e.preventDefault();setMode('login');}}>Already have an account? Login</a>
                        </div>
                    </form>
                )}

                {mode==='forgot'&&!otpSent&&(
                    <form onSubmit={doSendOtp}>
                        <p style={{color:'#666',fontSize:14,marginBottom:18,lineHeight:1.6}}>Enter your registered email or mobile number. A 6-digit verification code will be sent to you.</p>
                        <div style={{marginBottom:22}}>
                            <label>Email or Mobile Number</label>
                            <input type="text" placeholder="Email or mobile number" value={f.email} onChange={e=>fld('email',e.target.value)} required/>
                        </div>
                        <button type="submit" className="btn bp" style={{width:'100%',marginBottom:14,fontSize:16}}>Send Verification Code</button>
                        <div style={{textAlign:'center',fontSize:14}}>
                            <a href="#" style={{color:'var(--p)'}} onClick={e=>{e.preventDefault();setMode('login');}}>Back to Login</a>
                        </div>
                    </form>
                )}

                {mode==='forgot'&&otpSent&&(
                    <form onSubmit={doReset}>
                        <div style={{padding:14,background:'#f0fdf4',borderRadius:10,marginBottom:18,fontSize:13,color:'#166534'}}>
                            Code sent to your email and mobile number.
                        </div>
                        <div style={{marginBottom:14}}>
                            <label>6-Digit Verification Code</label>
                            <input type="text" maxLength={6} placeholder="Enter code" value={f.otp} onChange={e=>fld('otp',e.target.value)} required/>
                        </div>
                        <div style={{marginBottom:6}}>
                            <label>New Password</label>
                            <div className="pwc">
                                <input type={sp?'text':'password'} placeholder="New password" value={f.newpw} onChange={e=>fld('newpw',e.target.value)} required style={{paddingRight:46}}/>
                                <button type="button" className="pwt" onClick={()=>setSp(!sp)}>{sp?'🙈':'👁️'}</button>
                            </div>
                        </div>
                        <div style={{marginBottom:22}}>
                            <label>Confirm New Password</label>
                            <input type={sp?'text':'password'} placeholder="Re-enter new password" value={f.newpw2} onChange={e=>fld('newpw2',e.target.value)} required/>
                        </div>
                        <button type="submit" className="btn bp" style={{width:'100%',marginBottom:14,fontSize:16}}>Reset Password</button>
                    </form>
                )}
            </div>
        </div>
    );
};

/* ═══════════════════════════════════════════════════════════════════════
   CART MODAL
═══════════════════════════════════════════════════════════════════════ */
const CartModal=()=>{
    const{cart,setModal,remCart,updQty,user,cartSub}=useApp();
    const ship=cartSub>=500?0:40;
    const total=cartSub+ship;
    const checkout=()=>{
        if(!user){setModal('auth');return;}
        // Products need address; services go direct to payment
        const hasProduct=cart.some(i=>i.id>=100);
        const hasService=cart.some(i=>i.id<100);
        if(hasProduct){setModal('address');}
        else{setModal('pay');}
    };
    // Track cart abandonment — save draft when cart opens
    useEffect(()=>{
        if(cart.length>0){
            const draft={items:cart,timestamp:new Date().toISOString(),status:'abandoned'};
            localStorage.setItem('tw_cart_draft',JSON.stringify(draft));
        }
    },[cart]);
    return(
        <div className="modal" onClick={()=>setModal(null)}>
            <div className="mc" onClick={e=>e.stopPropagation()}>
                <button className="mc-x" onClick={()=>setModal(null)}>×</button>
                <h2 style={{marginBottom:24}}>Shopping Cart</h2>
                {cart.length===0?(
                    <div style={{textAlign:'center',padding:'40px 0'}}>
                        <div style={{fontSize:64,marginBottom:16}}>🛒</div>
                        <p style={{color:'#999'}}>Your cart is empty</p>
                    </div>
                ):(
                    <>
                        {cart.map(item=>(
                            <div key={item.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 0',borderBottom:'1px solid #f0f0f0'}}>
                                <div>
                                    <div style={{fontWeight:600,marginBottom:3}}>{item.title}</div>
                                    <div style={{color:'#666',fontSize:13}}>{'₹'+item.price.toLocaleString()+' each'}</div>
                                </div>
                                <div style={{display:'flex',alignItems:'center',gap:8}}>
                                    <button onClick={()=>updQty(item.id,-1)} style={{width:30,height:30,border:'1px solid #ddd',borderRadius:8,cursor:'pointer',background:'#f5f5f5',fontSize:16}}>−</button>
                                    <span style={{fontWeight:700,minWidth:24,textAlign:'center'}}>{item.qty}</span>
                                    <button onClick={()=>updQty(item.id,+1)} style={{width:30,height:30,border:'1px solid #ddd',borderRadius:8,cursor:'pointer',background:'#f5f5f5',fontSize:16}}>+</button>
                                    <button onClick={()=>remCart(item.id)} style={{padding:'4px 11px',background:'#fee2e2',border:'none',borderRadius:8,color:'#dc2626',cursor:'pointer',fontSize:12,fontWeight:600}}>Remove</button>
                                </div>
                            </div>
                        ))}
                        <div style={{marginTop:22,padding:18,background:'#f8f9fa',borderRadius:12}}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span>Subtotal</span><span>{'₹'+cartSub.toLocaleString()}</span></div>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}><span>Shipping</span><span style={{color:ship===0?'#16a34a':'inherit',fontWeight:600}}>{ship===0?'FREE':'₹'+ship}</span></div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:20,fontWeight:900,borderTop:'2px solid #e0e0e0',paddingTop:10}}>
                                <span>Total</span><span style={{color:'var(--p)'}}>{'₹'+total.toLocaleString()}</span>
                            </div>
                        </div>
                        <button className="btn bp" style={{width:'100%',marginTop:18,fontSize:16}} onClick={checkout}>
                            {user?'Proceed to Checkout →':'Login to Checkout →'}
                        </button>
                    </>
                )}
            </div>
        </div>
    );
};

/* ═══════════════════════════════════════════════════════════════════════
   PAYMENT MODAL
═══════════════════════════════════════════════════════════════════════ */
const PayModal=()=>{
    const{cart,setCart,setModal,user,paymentGateways,orders,upd,notify,cartSub}=useApp();
    const[sel,setSel]=useState(null);
    const ship=cartSub>=500?0:40;
    const total=cartSub+ship;
    const active=paymentGateways.filter(g=>g.enabled);

    const pay=async()=>{
        if(!sel){alert('Please select a payment method.');return;}
        const order={id:Date.now(),name:user.name,email:user.email,mobile:user.mobile,items:cart,subtotal:cartSub,shipping:ship,total,method:sel.name,status:'paid',date:new Date().toISOString().split('T')[0]};
        upd('orders',[...orders,order]);
        notify(order);
        setCart([]);
        setModal(null);
    };
    return(
        <div className="modal" onClick={()=>setModal(null)}>
            <div className="mc" onClick={e=>e.stopPropagation()}>
                <button className="mc-x" onClick={()=>setModal(null)}>×</button>
                <h2 style={{marginBottom:22}}>Secure Payment</h2>
                <div style={{background:'#f0fdf4',border:'2px solid #bbf7d0',borderRadius:14,padding:18,marginBottom:22,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{color:'#166534',fontSize:16}}>Amount to Pay</span>
                    <span style={{fontSize:28,fontWeight:900,color:'var(--p)'}}>{'₹'+total.toLocaleString()}</span>
                </div>
                <h3 style={{marginBottom:14,fontSize:18}}>Select Payment Method</h3>
                {active.length===0?(
                    <div style={{padding:20,background:'#fff3cd',borderRadius:12,color:'#856404',textAlign:'center'}}>No payment methods enabled. Admin can enable them in the Payments section.</div>
                ):(
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:12,marginBottom:22}}>
                        {active.map(gw=>(
                            <button key={gw.id} onClick={()=>setSel(gw)} style={{padding:14,border:'2px solid '+(sel?.id===gw.id?'var(--p)':'#e0e0e0'),borderRadius:12,background:sel?.id===gw.id?'#f0fdf4':'#fff',cursor:'pointer',textAlign:'center',transition:'.2s'}}>
                                <div style={{fontSize:28,marginBottom:7}}>{gw.icon}</div>
                                <div style={{fontSize:12,fontWeight:600,color:sel?.id===gw.id?'var(--p)':'#555'}}>{gw.name}</div>
                            </button>
                        ))}
                    </div>
                )}
                <button className="btn bp" style={{width:'100%',fontSize:16,padding:16,opacity:sel?1:.5}} onClick={pay} disabled={!sel}>
                    {'🔒 Pay ₹'+total.toLocaleString()+' Securely'}
                </button>
                <p style={{textAlign:'center',fontSize:12,color:'#aaa',marginTop:10}}>Encrypted and secure payment processing</p>
            </div>
        </div>
    );
};

                    </>
                )}
            </div>
        </div>
    );
};
/* ── ABANDONED ORDERS WIDGET ──────────────────────────────────────── */
const AbandonedOrders=()=>{
    const draft=React.useMemo(()=>{try{return JSON.parse(localStorage.getItem('tw_cart_draft')||'null');}catch{return null;}},[]);
    if(!draft)return <div style={{color:'#999',padding:'20px 0',textAlign:'center',fontSize:13}}>No abandoned carts detected</div>;
    return(
        <div>
            <div style={{padding:14,background:'#fef9c3',borderRadius:10,marginBottom:10,fontSize:13}}>
                <div style={{fontWeight:700,marginBottom:4}}>Abandoned Cart Detected</div>
                <div>Items: {draft.items.map(i=>i.title).join(', ')}</div>
                <div style={{color:'#666',marginTop:4}}>{'Started: '+new Date(draft.timestamp).toLocaleString()}</div>
            </div>
        </div>
    );
};
const AbandonedEnquiries=()=>{
    const draft=React.useMemo(()=>{try{return JSON.parse(localStorage.getItem('tw_enq_draft')||'null');}catch{return null;}},[]);
    if(!draft||Object.values(draft).every(v=>!v))return <div style={{color:'#999',padding:'20px 0',textAlign:'center',fontSize:13}}>No incomplete enquiries detected</div>;
    return(
        <div style={{padding:14,background:'#fef9c3',borderRadius:10,fontSize:13}}>
            <div style={{fontWeight:700,marginBottom:4}}>Incomplete Enquiry Draft</div>
            {Object.entries(draft).filter(([,v])=>v).map(([k,v])=>(
                <div key={k}><span style={{color:'#666'}}>{k}: </span>{v}</div>
            ))}
        </div>
    );
};

const AdminLogin=()=>{
    const{setAdminIn}=useApp();
    const[sp,setSp]=useState(false);
    const[id,setId]=useState('');
    const[pw,setPw]=useState('');
    const[err,setErr]=useState('');

    const login=e=>{
        e.preventDefault();
        setErr('');
        if(checkAdmin(id.trim(),pw)){
            setAdminIn(true);
        }else{
            setErr('Incorrect credentials. Contact administrator.');
            setPw('');
        }
    };
    return(
        <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#1a472a,#0a1f11)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>

                    <p style={{color:'#888',marginTop:6,fontSize:14}}>Authorised access only</p>
                </div>
                <form onSubmit={login}>
                    <div style={{marginBottom:16}}>
                        <label>Email or Mobile</label>
                        <input type="text" placeholder="Enter credentials" value={id} onChange={e=>setId(e.target.value)} required autoComplete="off"/>
                    </div>
                    <div style={{marginBottom:24}}>
                        <label>Password</label>
                        <div className="pwc">
                            <input type={sp?'text':'password'} placeholder="Enter password" value={pw} onChange={e=>setPw(e.target.value)} required style={{paddingRight:46}} autoComplete="new-password"/>
                            <button type="button" className="pwt" onClick={()=>setSp(!sp)}>{sp?'🙈':'👁️'}</button>
                        </div>
                    </div>
                    {err?<div style={{padding:12,background:'#fee2e2',borderRadius:10,color:'#991b1b',fontSize:13,marginBottom:16}}>{err}</div>:null}
                    <button type="submit" className="btn bp" style={{width:'100%',fontSize:16}}>Login to Dashboard</button>

                <div style={{marginTop:20,padding:14,background:'#f0fdf4',borderRadius:10,fontSize:13,color:'#166534',lineHeight:1.7}}>
                    <strong>First time?</strong> Contact the administrator for your credentials.<br/>
                    <strong>Forgot password?</strong> Call or email the site owner to reset.
                </div>
            </div>
        </div>
    );
};

const BlogPage=()=>{
    const{config}=useApp();
    const[posts,setPosts]=useState([]);
    const[loading,setLoading]=useState(false);
    const[err,setErr]=useState('');
    useEffect(()=>{
        if(config.blogMode==='api'&&config.blogApiKey&&config.blogUrl){
            setLoading(true);setErr('');
            const blogId=config.blogUrl.replace(/.*blogspot\.com\/?/,'').replace(/\//g,'')||config.blogBlogId||'';
            const apiUrl='https://www.googleapis.com/blogger/v3/blogs/byurl?url='+encodeURIComponent(config.blogUrl)+'&key='+config.blogApiKey;
            fetch(apiUrl)
                .then(r=>r.json())
                .then(data=>{
                    if(data.error){setErr('API Error: '+(data.error.message||'Check API key'));setLoading(false);return;}
                    const postsUrl='https://www.googleapis.com/blogger/v3/blogs/'+data.id+'/posts?key='+config.blogApiKey+'&maxResults=9';
                    return fetch(postsUrl).then(r=>r.json());
                })
                .then(data=>{
                    if(data&&data.items){setPosts(data.items);}else{setErr('No posts found.');}
                    setLoading(false);
                })
                .catch(e=>{setErr('Failed to load posts: '+e.message);setLoading(false);});
        }
    },[config.blogMode,config.blogApiKey,config.blogUrl]);
    return(
        <div style={{padding:'60px 20px'}}>
            <div className="con">
                <h1 style={{fontSize:44,marginBottom:10,textAlign:'center'}}>Blog and Insights</h1>
                <p style={{textAlign:'center',color:'#666',fontSize:17,marginBottom:48}}>Wisdom, inspiration and practical tools</p>

                    <div className="card" style={{textAlign:'center',padding:'68px 40px',maxWidth:580,margin:'0 auto'}}>

                        <p style={{color:'#666',marginBottom:30,fontSize:16,lineHeight:1.7}}>Read our latest articles, insights and coaching tips</p>

                    </div>
                ):(
                    <div>
                        {loading&&<div style={{textAlign:'center',padding:'60px 0',color:'#666'}}>Loading posts...</div>}
                        {err&&<div style={{padding:16,background:'#fee2e2',borderRadius:12,color:'#dc2626',marginBottom:20}}>{err}</div>}
                        {!loading&&!err&&posts.length===0&&<div style={{textAlign:'center',padding:'60px 0',color:'#666'}}>No posts loaded yet. Check your API key in Admin.</div>}
                        <div className="g3">
                            {posts.map(post=>(
                                <a key={post.id} href={post.url} target="_blank" rel="noopener noreferrer" style={{textDecoration:'none'}}>
                                    <div className="card" style={{padding:0,overflow:'hidden'}}>
                                        {post.images&&post.images[0]?(
                                            <img src={post.images[0].url} alt={post.title} style={{width:'100%',height:180,objectFit:'cover'}}/>

                                        )}
                                        <div style={{padding:20}}>
                                            <h3 style={{fontSize:17,marginBottom:8,lineHeight:1.4}}>{post.title}</h3>
                                            <p style={{color:'#666',fontSize:13,lineHeight:1.6}}>{(post.labels||[]).join(' · ')}</p>

const ContactPage=()=>{
    const{config,enquiryTypes,enquiries,upd}=useApp();
    const[f,setF]=useState({name:'',email:'',mobile:'',location:'',type:'',message:''});
    const fld=(k,v)=>{setF(p=>{const nv={...p,[k]:v};localStorage.setItem('tw_enq_draft',JSON.stringify(nv));return nv;});};
    const submit=async e=>{
        e.preventDefault();
        const newEnq={...f,id:Date.now(),date:new Date().toISOString().split('T')[0]};
        upd('enquiries',[...enquiries,newEnq]);
        await notify(newEnq,'enquiry');
        localStorage.removeItem('tw_enq_draft');
        setF({name:'',email:'',mobile:'',location:'',type:'',message:''});
    };
    return(
        <div style={{padding:'60px 20px'}}>
            <div className="con" style={{maxWidth:820}}>
                <h1 style={{fontSize:44,marginBottom:10,textAlign:'center'}}>Get In Touch</h1>

                <div className="card">
                    <form onSubmit={submit}>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
                            <div><label>Full Name</label><input type="text" value={f.name} onChange={e=>fld('name',e.target.value)} required/></div>
                            <div><label>Email</label><input type="email" value={f.email} onChange={e=>fld('email',e.target.value)} required/></div>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
                            <div><label>Mobile</label><input type="tel" value={f.mobile} onChange={e=>fld('mobile',e.target.value)} required/></div>
                            <div><label>Location (City, Country)</label><input type="text" placeholder="Mumbai, India" value={f.location} onChange={e=>fld('location',e.target.value)} required/></div>
                        </div>
                        <div style={{marginBottom:16}}><label>Enquiry Type</label>
                            <select value={f.type} onChange={e=>fld('type',e.target.value)} required>
                                <option value="">Select type...</option>
                                {enquiryTypes.map(t=><option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <div style={{marginBottom:22}}><label>Message</label><textarea rows={5} value={f.message} onChange={e=>fld('message',e.target.value)} required/></div>
                        <button type="submit" className="btn bp" style={{width:'100%',fontSize:16}}>Send Message</button>
                    </form>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginTop:22}}>
                    <div className="card" style={{background:'#f0fdf4',padding:22}}>
                        <div style={{fontSize:30,marginBottom:8}}>📞</div>
                        <div style={{fontWeight:700,marginBottom:4}}>Phone</div>
                        <div style={{color:'#166534'}}>{config.contact.mobile}</div>
                    </div>
                    <div className="card" style={{background:'#eff6ff',padding:22}}>
                        <div style={{fontSize:30,marginBottom:8}}>✉️</div>
                        <div style={{fontWeight:700,marginBottom:4}}>Email</div>
                        <div style={{color:'#1d4ed8'}}>{config.contact.email}</div>
                    </div>
                </div>
            </div>
        </div>
    );
};

/* ── BOOT ─────────────────────────────────────────────────────────── */
try{
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}catch(err){
    document.getElementById('root').innerHTML='<div style="padding:40px;font-family:sans-serif;max-width:600px;margin:40px auto;"><h2 style="color:#dc2626">Startup Error</h2><pre style="background:#fee2e2;padding:16px;border-radius:8px;overflow:auto">'+err.message+'</pre></div>';
    console.error(err);
}
</script>
</body>
</html>
